name: media
# Панель TEVSTUDIO: забрать файлы с tevstudio.ru/m/ и выложить на GitHub Pages для Buffer/Instagram.
on:
  workflow_dispatch:
    inputs:
      dir:
        description: "папка (дата-секрет)"
        required: true
      files:
        description: "файлы через запятую"
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: media
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать файлы и убрать старые
        env:
          DIR: ${{ inputs.dir }}
          FILES: ${{ inputs.files }}
          ORIGIN: https://tevstudio.ru/m
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DIR" =~ ^[0-9]{8}-[A-Za-z0-9_-]{16,48}$ ]] || { echo "bad dir"; exit 1; }
          [[ "$FILES" =~ ^([0-9]{2}\.(jpg|mp4),?){1,20}$ ]] || { echo "bad files"; exit 1; }
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git clone -q --depth 1 --branch store "$URL" site 2>/dev/null || { mkdir site; git -C site init -q; }
          cd site
          touch .nojekyll
          mkdir -p "m/$DIR"
          IFS=',' read -ra F <<< "$FILES"
          for f in "${F[@]}"; do
            [ -n "$f" ] || continue
            curl -fsSL --retry 4 --retry-delay 5 -m 300 -A "Mozilla/5.0 (compatible; tev-media/1.0)" "$ORIGIN/$DIR/$f" -o "m/$DIR/$f"
          done
          old=$(date -u -d '2 days ago' +%Y%m%d)
          for d in m/*/; do n=$(basename "$d"); if [[ "${n%%-*}" < "$old" ]]; then rm -rf "$d"; fi; done
          git config user.name media-bot; git config user.email media-bot@users.noreply.github.com
          git checkout -q --orphan fresh; git add -A; git commit -qm "media $DIR"
          git push -qf "$URL" fresh:store
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
